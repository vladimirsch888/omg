<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1a1917" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Учёт выручки" />
    <title>Учёт выручки</title>
    <script>
      // Applies the saved theme before first paint. Without this the page
      // renders in the default (dark) palette for a frame and flashes when
      // React mounts — very visible for anyone using the light theme.
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var mode =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia("(prefers-color-scheme: light)").matches
                ? "light"
                : "dark";
          document.documentElement.dataset.theme = mode;
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute("content", mode === "light" ? "#faf9f7" : "#1a1917");
        } catch (e) {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

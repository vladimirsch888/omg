name: Deploy to production

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy over SSH
        run: |
          ssh -i ~/.ssh/id_ed25519 "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" '
            set -e
            cd /opt/revenue-saas-prod
            git fetch origin main
            git reset --hard origin/main
            npm install
            npm run build:api
            npm run prisma:deploy --workspace apps/api
            npm run build:web
            sudo systemctl restart revenue-api-prod
          '

      - name: Health check
        run: |
          sleep 3
          curl -fsS "http://${{ secrets.VPS_HOST }}/" -o /dev/null

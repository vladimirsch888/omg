name: Deploy to production

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy over SSH
        run: |
          ssh -i ~/.ssh/id_ed25519 "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" '
            set -e
            cd /opt/revenue-saas-prod
            git fetch origin main
            git reset --hard origin/main
            npm install
            npm run build:api
            npm run prisma:deploy --workspace apps/api
            npm run build:web
            sudo systemctl restart revenue-api-prod
          '

      - name: Health check
        env:
          BASE_URL: ${{ secrets.PROD_URL }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          # The API answers /api/health only when Node is up AND Nginx proxies to
          # it — checking "/" alone would pass with the API down. PROD_URL is an
          # optional secret (https://your.domain); without it the plain IP is used.
          URL="${BASE_URL:-http://$VPS_HOST}/api/health"
          for i in 1 2 3 4 5 6; do
            if curl -fsS -m 10 "$URL" | grep -q '"ok":true'; then
              echo "API healthy"; exit 0
            fi
            sleep 4
          done
          echo "API did not become healthy at $URL"; exit 1

name: Deploy to staging

on:
  push:
    branches: [staging]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy over SSH
        run: |
          ssh -i ~/.ssh/id_ed25519 "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" '
            set -e
            cd /opt/revenue-saas-staging
            git fetch origin staging
            git reset --hard origin/staging
            npm install
            npm run build:api
            npm run prisma:deploy --workspace apps/api
            npm run build:web
            sudo systemctl restart revenue-api-staging
          '

      - name: Health check
        env:
          BASE_URL: ${{ secrets.STAGING_URL }}
          BASIC_AUTH: ${{ secrets.STAGING_BASIC_AUTH }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          # The API answers /api/health only when Node is up AND Nginx proxies to
          # it — checking "/" alone would pass with the API down. STAGING_URL and
          # STAGING_BASIC_AUTH (user:password) are optional secrets for an HTTPS
          # staging behind basic auth; without them the plain IP:8080 is used.
          URL="${BASE_URL:-http://$VPS_HOST:8080}/api/health"
          for i in 1 2 3 4 5 6; do
            if curl -fsS -m 10 ${BASIC_AUTH:+-u "$BASIC_AUTH"} "$URL" | grep -q '"ok":true'; then
              echo "API healthy"; exit 0
            fi
            sleep 4
          done
          echo "API did not become healthy at $URL"; exit 1

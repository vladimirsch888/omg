<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Service Banner — админ-панель</title>
<style>
  body { font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif; max-width: 560px; margin: 40px auto; padding: 0 16px; color: #222; }
  h1 { font-size: 18px; }
  label { display: block; margin-top: 16px; font-size: 13px; font-weight: 600; color: #555; }
  input, textarea { width: 100%; box-sizing: border-box; padding: 8px 10px; margin-top: 6px; font-size: 14px; border: 1px solid #ccc; border-radius: 4px; font-family: inherit; }
  textarea { min-height: 100px; resize: vertical; }
  button { margin-top: 16px; padding: 9px 18px; font-size: 14px; border: none; border-radius: 4px; background: #4a7de8; color: #fff; cursor: pointer; }
  button:disabled { opacity: 0.6; cursor: default; }
  button.secondary { background: #eee; color: #333; margin-left: 8px; }
  #status { margin-top: 12px; font-size: 13px; }
  #status.error { color: #c0392b; }
  #status.ok { color: #1e8449; }
</style>
</head>
<body>
  <h1>Service Banner — управление текстом</h1>
  <p>Здесь администратор задаёт текст, который увидят все пользователи аккаунта amoCRM над списком сделок.</p>

  <label for="domain">Поддомен amoCRM (например, mycompany.amocrm.ru)</label>
  <input id="domain" type="text" placeholder="mycompany.amocrm.ru" />

  <label for="token">Токен администратора</label>
  <input id="token" type="password" placeholder="ADMIN_TOKEN" />

  <label for="text">Текст баннера</label>
  <textarea id="text" placeholder="Например: Аккаунт находится на обслуживании"></textarea>

  <div>
    <button id="loadBtn">Загрузить текущий текст</button>
    <button id="saveBtn" class="secondary">Сохранить</button>
  </div>
  <div id="status"></div>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var statusEl = $('status');

  function setStatus(text, kind) {
    statusEl.textContent = text;
    statusEl.className = kind || '';
  }

  function apiUrl(path) {
    return window.location.origin + path;
  }

  $('loadBtn').addEventListener('click', function () {
    var domain = $('domain').value.trim();
    if (!domain) { setStatus('Укажите поддомен', 'error'); return; }

    setStatus('Загрузка...');
    fetch(apiUrl('/api/banner?domain=' + encodeURIComponent(domain)))
      .then(function (r) { return r.json(); })
      .then(function (data) {
        $('text').value = data.text || '';
        setStatus(data.updatedAt ? ('Обновлено: ' + data.updatedAt) : 'Текст ещё не задан', 'ok');
      })
      .catch(function () { setStatus('Ошибка загрузки', 'error'); });
  });

  $('saveBtn').addEventListener('click', function () {
    var domain = $('domain').value.trim();
    var token = $('token').value.trim();
    var text = $('text').value;

    if (!domain) { setStatus('Укажите поддомен', 'error'); return; }
    if (!token) { setStatus('Укажите токен администратора', 'error'); return; }

    setStatus('Сохранение...');
    fetch(apiUrl('/api/banner'), {
      method: 'PUT',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + token
      },
      body: JSON.stringify({ domain: domain, text: text })
    })
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(function (data) {
        setStatus('Сохранено: ' + data.updatedAt, 'ok');
      })
      .catch(function (err) { setStatus('Ошибка сохранения (' + err.message + ')', 'error'); });
  });
})();
</script>
</body>
</html>
